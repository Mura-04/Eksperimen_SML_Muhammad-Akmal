name: Data Preprocessing Automation

on:
  push:
    branches:
      - main
  workflow_dispatch: 
permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn

    - name: Run Preprocessing Script
      run: |
        python preprocessing/automate_Muhammad-Akmal.py

    - name: Commit and Push Preprocessed Data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Mengecek apakah ada perubahan pada file hasil preprocessing
        git add preprocessing/heart_preprocessing.csv
        
        # Menggunakan 'git diff' untuk memastikan hanya commit jika ada perubahan yang nyata
        if ! git diff --cached --quiet; then
          git commit -m "Bot: Update preprocessed dataset otomatis"
          git push
        else
          echo "Tidak ada perubahan pada file, melewati proses commit."
        fi